# Keysight Support (STG) - Request Technical Support.
# Migrated from Selenium RequestTechnicalSupportPage.java (only the elements
# used by DCX-8554). Selenium XPaths are kept as the primary locator.

meta:
  name: requestTechnicalSupport
  description: Product Help menu and the Request Technical Support case form
  url: "?language=en_US"

elements:
  productHelpMenu:
    description: Product Help button in the header navigation that opens the Product Help menu
    xpath: "//button[normalize-space()='Product Help']"
    index: first

  requestTechnicalSupportOption:
    description: Request Technical Support entry in the Product Help menu
    xpath: "//a[@class='level2Link' and normalize-space()='Request Technical Support'] | //span[normalize-space()='Request Technical Support']"
    index: first

  pageHeading:
    description: Page heading reading "Request Technical Support"
    xpath: "//h1[text()='Request Technical Support']"
    index: first

  subjectInput:
    description: Subject field where the user states the problem when creating a support case
    xpath: "//input[@class='slds-input' and (@placeholder='Search or ask a question' or @placeholder='Ask a question or state your problem...')] | //input[@data-testid='ts-subject-input']"
    index: first

  descriptionInput:
    description: Description text area where the user details the problem when creating a support case
    xpath: "//textarea[@class='slds-textarea'] | //textarea[@data-testid='ts-description-input']"
    index: first

  submitButton:
    description: Submit button that creates the support case
    xpath: "//button[@class='submit roundy'] | //button[@data-testid='ts-submit-btn' and not(@disabled)]"
    index: first

  submitButtonDisabled:
    description: Submit button of the support case form while mandatory fields are still empty (disabled state)
    xpath: "//button[@class='submit roundy'] | //button[@data-testid='ts-submit-btn' and @disabled]"
    index: first

  toastTitle:
    description: Title line of the toast notification shown after an action, e.g. "Support Case Created"
    xpath: "//div[contains(@class, 'toastTitle')] | //div[@role='alert']//p"
    index: first

  mySupportCasesHeading:
    description: Heading of the My Support Cases page shown after a case has been created
    xpath: "//div[@class='head-text'] | //h2[text()='My Support Cases']"
    index: first

  chevronShowAdditionalInfo:
    description: Chevron that expands the collapsed Additional Information section of the support case form
    xpath: "//lightning-icon[@title='Show']//lightning-primitive-icon[@exportparts='icon']//*[name()='svg'] | //button[@aria-expanded='false']/ksp-icon[@data-icon-type='chevron-down']"
    index: first

  additionalInfoContent:
    description: Expanded Additional Information section of the support case form
    xpath: "//slot[@class='slds-p-around_large']//div[@class='card'] | //div[@data-testid='ts-additional-info-content']"
    index: first

  toastDescription:
    description: Description line of the toast shown after submitting a case; contains the new case number
    xpath: "//*[contains(@class, 'toastMessage')] | //div[@role='alert']//div[@aria-hidden='true']//p[2]"
    index: first

  certificateInput:
    description: Certificate number field in the Additional Information section
    xpath: "//label[contains(text(),'Certificate')]/following::input[1]"
    index: first

  orderInput:
    description: Order number field in the Additional Information section
    xpath: "//label[contains(text(),'Order')]/following::input[1]"
    index: first

  currentInput:
    description: Current (software version) field in the Additional Information section
    xpath: "//label[contains(text(),'Current')]/following::input[1]"
    index: first

  fixturesInput:
    description: Fixtures field in the Additional Information section
    xpath: "//label[contains(text(),'Fixtures')]/following::input[1]"
    index: first

  issueTypeDropdown:
    description: Issue Type dropdown in the Additional Information section
    xpath: "//input[@placeholder='Select type' and @name='case'] | //input[@id='combobox-issue-type']"
    index: first

  issueReproducibilityDropdown:
    description: Issue Reproducibility dropdown in the Additional Information section
    xpath: "//input[@placeholder='Select reproducibility' and @name='case'] | //input[@id='combobox-issue-reproducibility']"
    index: first

  softwarePlatformDropdown:
    description: Software Platform dropdown in the Additional Information section
    xpath: "(//input[@class='slds-input slds-combobox__input lclinput ksp'])[3] | //input[@id='combobox-software-platform']"
    index: first

  hardwareSoftwareChangedDropdown:
    description: Has The Hardware / Software Changed Recently dropdown in the Additional Information section
    xpath: "//input[@placeholder='Select option' and @name='case'] | //input[@placeholder='Select an Option']"
    index: first

  osPlatformDropdown:
    description: Operating System Platform dropdown in the Additional Information section
    xpath: "(//input[@class='slds-input slds-combobox__input lclinput ksp'])[5] | //input[@id='combobox-operating-system-platform']"
    index: first

  dropdownOptions:
    description: Visible option labels of the currently opened dropdown; filtered by exact option text
    xpath: "//span[normalize-space()]"
    multiple: true

  addProductCaseBtn:
    description: Add Product(s) to Case button in the Request Technical Support form; opens the product search modal
    xpath: "//button[normalize-space()='Add Product(s) to Case'] | //button[@data-testid='ts-add-products-btn']"

  searchProductInputBox:
    description: Product search input in the Add Product(s) to Case modal, where a model or product number is typed
    xpath: "//input[contains(@placeholder, 'Enter to Search Products')] | //input[contains(@placeholder, 'Search by model')] | //input[@data-testid='ts-search-products-input']"

  productSearchIcon:
    description: Search icon next to the product search input; runs the product search
    xpath: "//div[@class='search-icon'] | //div[@data-testid='ts-search-products-input-wrapper']/*[@aria-label='Search']"

  selectProductCheckBox:
    description: Selection checkbox of the product found by the search in the Add Product(s) to Case modal
    xpath: "//div[@class='hovertarget'] | (//input[@type='checkbox']/following-sibling::div)[2]"

  addSelectedProductsBtn:
    description: Add selected products button in the Add Product(s) to Case modal; adds the ticked products to the case
    xpath: "//c-dcx_button[@class='slds-p-left_large'] | //span[text()='Add selected products']"

  productInfoProduct:
    description: Product line of the product card in the Product Information section of the case form
    xpath: "//div[contains(@data-testid,'ts-product-card')]//span[text()='Product']/parent::p"

  generatedAnswer:
    description: Generated (AI smart) answer text shown under the subject field once a subject is entered
    xpath: "//div[@class='generated-answer-content__answer'] | //div[@data-testid='ks-genai-answer']/div[2]"

  smartAnswerToggle:
    description: Smart Answer switch next to the subject field; clicking it turns smart answers on or off
    xpath: "//span[@class='slds-checkbox_faux'] | //button[@data-testid='ks-genai-toggle']"

  smartToggleOFF:
    description: Smart Answer switch in its OFF state (present only while smart answers are disabled)
    xpath: "//span[@class ='slds-checkbox_off'] | //button[@data-testid='ks-genai-toggle' and @aria-checked='false']"
    heal: false

  smartToggleON:
    description: Smart Answer switch in its ON state (present only while smart answers are enabled)
    xpath: "//span[@class ='slds-checkbox_on'] | //button[@data-testid='ks-genai-toggle' and @aria-checked='true']"
    heal: false

