# Keysight Support (STG) - My Profile > Personal Information.
# Migrated from Selenium MyProfilePersonalInformationPage.java.
# Selenium XPaths are kept as the primary locator (they are the proven ones on
# this application); `multiple: true` marks collections the Selenium page
# object read with findElements().

meta:
  name: myProfile
  description: My Profile page - Your Details and Additional Details sections
  url: "?language=en_US"

elements:
  heading:
    description: Page heading reading "My Profile"
    xpath: "//h2[normalize-space()='My Profile']"
    index: first

  sectionHeadings:
    description: The section headings on the My Profile page (Your Details, then Additional Details)
    xpath: "//h4 | //h2[@class='sub-title']"
    multiple: true

  yourDetailsLabels:
    description: Field labels listed in the Your Details section, in display order
    xpath: "//div[@data-testid='profile-your-details-labels']/span"
    multiple: true

  yourDetailsValueFields:
    description: Read-only value cells in the Your Details section
    xpath: "//h4[text()='Your Details']/parent::div/following-sibling::div[1]//span[2]"
    multiple: true

  yourDetailsEditButton:
    description: Change (edit) button in the Your Details section header
    xpath: "//h4[text()='Your Details']/parent::div//button[contains(.,'Change')]"
    index: first

  additionalDetailsLabels:
    description: Field labels listed in the Additional Details section, in display order
    xpath: "//div[@data-testid='profile-additional-details-labels']//span"
    multiple: true

  additionalDetailsEditButton:
    description: Change (edit) button in the Additional Details section header
    xpath: "//h4[text()='Additional Details']/parent::div//button[contains(.,'Change')]"
    index: first

  firstNameInput:
    description: First (Given) Name input in the Your Details edit form
    xpath: "(//div[@class='relative w-full']/input)[1]"
    index: first

  lastNameInput:
    description: Last (Family) Name input in the Your Details edit form
    xpath: "(//div[@class='relative w-full']/input)[2]"
    index: first

  cityInput:
    description: City input in the Your Details edit form
    xpath: "(//div[@class='relative w-full']/input)[5]"
    index: first

  stateInput:
    description: State Or Province input in the Your Details edit form
    xpath: "(//div[@class='relative w-full']/input)[6]"
    index: first

  countryDropdown:
    description: Country selector (native select or Radix select button) in the Your Details edit form
    xpath: "//div[@class='relative w-full']/select | //button[@data-testid='profile-edit-country-select']"
    index: first

  countryPopperOptions:
    description: Entries of the open Country dropdown popup (Radix popper), matched by their text
    xpath: "//div[@data-radix-popper-content-wrapper] | //div[@data-radix-popper-content-wrapper]//span"
    multiple: true
    heal: false

  saveChangesButton:
    description: Save Changes button of the edit form
    xpath: "//*/span[normalize-space()='Save Changes']"
    index: first

  saveChangesButtonDisabled:
    description: Save Changes button while it is disabled (no edits made yet)
    xpath: "//button[@data-slot='button' and @disabled]/span[text()='Save Changes']"
    index: first
    heal: false

  cancelButton:
    description: Cancel button of the edit form
    xpath: "//*/span[normalize-space()='Cancel']"
    index: first

  yourDetailsFirstName:
    description: Displayed First Name value in the Your Details section after saving
    xpath: "(//h4[text()='Your Details']/parent::div/following-sibling::div[1]//span[1])[2]"
    index: first

  yourDetailsLastName:
    description: Displayed Last Name value in the Your Details section after saving
    xpath: "(//h4[text()='Your Details']/parent::div/following-sibling::div[1]//span[2])[2]"
    index: first

  yourDetailsCity:
    description: Displayed City value in the Your Details section after saving
    xpath: "(//h4[text()='Your Details']/parent::div/following-sibling::div[1]//span[5])[2]"
    index: first

  yourDetailsState:
    description: Displayed State value in the Your Details section after saving
    xpath: "(//h4[text()='Your Details']/parent::div/following-sibling::div[1]//span[6])[2]"
    index: first

  yourDetailsCountry:
    description: Displayed Country value in the Your Details section after saving
    xpath: "(//h4[text()='Your Details']/parent::div/following-sibling::div[1]//span[7])[2]"
    index: first

  errorMessages:
    description: Inline validation messages shown under mandatory fields (Complete this field / required)
    xpath: "//p[normalize-space()='Complete this field.'] | //p[contains(text(),'required')]"
    multiple: true

  toastMessage:
    description: Toast notification text shown after saving profile changes
    xpath: "//div[@role='alert']//p"
    index: first

  prefixInput:
    description: Prefix input in the Additional Details edit form
    xpath: "//label[text()='Prefix']/parent::div/following-sibling::div//input"
    index: first

  jobTitleInput:
    description: Job Title input in the Additional Details edit form
    xpath: "//label[text()='Job Title']/parent::div/following-sibling::div//input"
    index: first

  departmentInput:
    description: Department input in the Additional Details edit form
    xpath: "//label[text()='Department']/parent::div/following-sibling::div//input"
    index: first

  phoneNumberInput:
    description: Phone Number input in the Additional Details edit form
    xpath: "//label[text()='Phone Number']/parent::div/following-sibling::div//input"
    index: first

  mobileNumberInput:
    description: Mobile Number input in the Additional Details edit form
    xpath: "//label[text()='Mobile Number']/parent::div/following-sibling::div//input"
    index: first

  faxInput:
    description: Fax input in the Additional Details edit form
    xpath: "//label[text()='Fax']/parent::div/following-sibling::div//input"
    index: first

  addressLine1Input:
    description: Address Line 1 input in the Additional Details edit form
    xpath: "//label[text()='Address Line 1']/parent::div/following-sibling::div//input"
    index: first

  addressLine2Input:
    description: Address Line 2 input in the Additional Details edit form
    xpath: "//label[text()='Address Line 2']/parent::div/following-sibling::div//input"
    index: first

  addressLine3Input:
    description: Address Line 3 input in the Additional Details edit form
    xpath: "//label[text()='Address Line 3']/parent::div/following-sibling::div//input"
    index: first

  zipCodeInput:
    description: Zip or Postal Code input in the Additional Details edit form
    xpath: "//label[text()='Zip or Postal Code']/parent::div/following-sibling::div//input"
    index: first

  editFormInputs:
    description: Every text input currently shown in an edit form
    xpath: "//div[@class='relative w-full']/input"
    multiple: true

  updatedAdditionalDetails:
    description: Displayed values in the Additional Details section after saving, in display order
    xpath: "//h4[text()='Additional Details']/parent::div/following-sibling::div/div[@data-testid='profile-additional-details-values']/span"
    multiple: true

