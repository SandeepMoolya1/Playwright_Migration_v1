# Keysight Support (STG) - Manage Assets page: navigation, search, filter pills,
# Column Selector modal and the asset grid.
# Migrated from Selenium ManageAssetsPage.java and ServiceOrderManagementPage.java
# (only the elements used by ASTM_122). Selenium XPaths are kept as primary.

meta:
  name: manageAssets
  description: Hardware > Manage Assets page with asset search, Column Selector and the asset grid
  url: "?language=en_US"

elements:
  hardwareMenu:
    description: Hardware button in the header navigation that opens the Hardware menu
    xpath: "//button[normalize-space()='Hardware']"
    index: first

  manageAssetsOption:
    description: Manage Assets entry in the Hardware menu
    xpath: "//a[normalize-space()='Manage Assets']"
    index: first

  intermittentCloseButton:
    heal: false   # optional: absence is a valid state, never heal it into another element
    description: Close button of an intermittent modal/section header that can cover the Manage Assets page
    xpath: "//section//header//button[@title='Close']"
    index: first

  pageHeading:
    description: Page heading of Manage Assets, reading "Assets"
    xpath: "//h1[text()='Assets']"
    index: first

  columnSelectorButton:
    description: Column Selector button above the asset grid that opens the visible-columns dialog
    xpath: "//button[normalize-space()='Column Selector']"
    index: first

  columnSelectorModalTitle:
    heal: false   # polled while the dialog is still opening; healing it would mask the real timing
    description: Title of the Column Selector dialog
    xpath: "//h3[normalize-space()='Column Selector']"
    index: first

  visibleColumnOptions:
    heal: false   # optional: absence is a valid state, never heal it into another element
    description: Entries currently listed under Visible Columns in the Column Selector dialog
    xpath: "(//div[@class='slds-dueling-list__options'])[2]//li"
    index: first

  availableColumnAssetNumber:
    description: Asset Number entry in the Column Selector dialog
    xpath: "//*[@class='slds-modal__content slds-p-around_medium']//span[text()='Asset Number']"
    index: first

  moveToVisibleButton:
    description: Button that moves the selected column to Visible Columns
    xpath: "//button[normalize-space()='Move selection to Visible Columns']"
    index: first

  moveToAvailableButton:
    description: Button that moves the selected columns back to Available Columns
    xpath: "//button[normalize-space()='Move selection to Available Columns']"
    index: first

  applyButton:
    description: Apply button of the Column Selector dialog
    xpath: "//button[normalize-space()='Apply']"
    index: first

  firstAssetCheckbox:
    description: Checkbox of the first row of the asset grid, present once the grid has loaded
    xpath: "(//tbody//span[@class='slds-checkbox_faux'])[1] | (//div[@class='tabulator-tableHolder']//span[@class='slds-checkbox_faux'])[1]"
    index: first

  actionPanelChevron:
    description: Chevron that collapses the action panel next to the asset grid
    xpath: "//div/*[@title='Hide Action Panel'] | //div[@class=\"action-icon-box\"]"
    index: first

  tabulatorHeaders:
    description: Column titles of the tabulator asset grid (KSP); the first one is the selection column
    xpath: "//div[@class='tabulator-col-title']"
    multiple: true

  sldsHeaders:
    description: Column titles of the SLDS asset table (CAMS)
    xpath: "//span[@class='slds-truncate' and @title]"
    multiple: true

  filterPills:
    heal: false   # optional: absence is a valid state, never heal it into another element
    description: Applied filter pills above the asset grid, each removable with a click
    xpath: "//div[@class='filter-rn']/div//button"
    multiple: true

  filterPillRemoveIcon:
    description: Remove (x) icon inside an applied filter pill above the asset grid
    xpath: "//div[@class='filter-rn']/div//button//*[name()='svg']"
    index: first

  assetSearchBox:
    description: Search box on the Assets page where an asset number is typed
    xpath: "//input[@class='slds-input']"
    index: first

  searchSuggestionCount:
    description: Count shown next to the Asset Number group in the search suggestions
    xpath: "//span[@class='item-count']"
    index: first

  assetNumberColumnFilter:
    description: Filter input under the ASSET NUMBER column of the asset grid
    xpath: "//span[@title='ASSET NUMBER']/following::div[@class='slds-p-vertical_small fields-hpadding'][1]//input | //div[text()='Asset Number']//following::input[1]"
    index: first

  totalRecords:
    description: Total records indicator of the asset grid
    xpath: "//*[@class='total']"
    index: first

