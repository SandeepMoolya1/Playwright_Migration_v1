# Parameterised locators in ManageAssetsPage — build these in the page object
# (e.g. a base key plus `.filter({ hasText })`), they cannot be static keys:
#   reportFequencyCheckbox(String frequency) -> xpath: //span[text()='{frequency}']/preceding-sibling::input
#   assetSearchResult(String assetNumber) -> xpath: //div[@class='list-item' and @data-name='{assetNumber}']
#   assetFilterPill(String asset) -> xpath: //div[@class='filter-rn']//lightning-button/button[contains(@title,'{asset}')]| //div[@class='filter-rn']//c-search-item-view//button[contains(@title,'{asset}')]
#   menuItems(String text) -> xpath: //input[@placeholder='{text}']
#   customReportName(String text) -> xpath: (//span[text()='{text}'])[1]
#   exportOption(String text) -> xpath: //c-base-combobox-item[@data-value='{text}']
#   toastMessage(String text) -> xpath: //u[text()='{text}']
#   assetPageButtons(String text) -> xpath: //c-dcx_button/button[@title='{text}'] | //div/*[@placeholder='{text}']
#   assetPageEmptyFields(String text) -> xpath: (//*[text()='{text}'])/following-sibling::div[contains(@class,'slds-form-element__control')] //input | (//*[normalize-space()='{text}'])/following-sibling::div[contains(@class,'slds-is-relative')] //input
#   selectsFilter(String category, String filterName) -> xpath: //*[@class='slds-accordion filterlist']//button[@title='{category}']//following::div//input[@value='{filterName}'] | //*[@class='slds-accordion filterlist']//div[text()='{category}']//following::input[@value='{filterName}'] 
#   exportOptionByText(String option) -> xpath: //c-base-combobox-item[@data-value='{option}']
#   assetActionByText(String actionName) -> xpath: //div[contains(@class,'action-bottom-box-text')]//div[normalize-space()='{actionName}']
#   serviceHistorySection(String section) -> xpath: //*[@class='slds-tabs_default__link' and text() ='{section}'] | //div[@class='tableheader' and text() ='{section}']
#   headerSelection(String columnName) -> xpath: //*[@class='slds-line-height_reset']/th[@aria-label='{columnName}']//following::div[@class='slds-p-vertical_small fields-hpadding']//input
#   selectedHeaderDropdownOption(String dropdownOption) -> xpath: //div[@class='litem slds-p-around_small']//div[text()='{dropdownOption}']
#   headerSelectionForKSP(String headerName) -> xpath: //*[@class='tabulator-header']//div[@tabulator-field='{headerName}']//div[@class='tabulator-header-filter']/input
#   headerOptionForKSP(String option) -> xpath: //div[@class='tabulator-edit-select-list']/div[text()='{option}']
#   assetGridColumnCells(String columnField) -> xpath: //div[contains(@class,'tabulator-tableHolder')]//div[@tabulator-field='{columnField}']
#   assetGridFilteredColumnCells(String columnField, String option) -> xpath: //div[contains(@class,'tabulator-tableHolder')]//div[@tabulator-field='{columnField}' and @title='{option}']
#   filterPill(String filter) -> xpath: //div[@class='slds-accordion__content']//button[@title='{filter}']
#   modelNumberSuggestions(int index) -> xpath: (//*[@class='slds-form-element__control']//ul/li)['{index}']
#   assignedOrganizationSuggestions(String assignedOrg) -> xpath: //*[@class='litem slds-p-around_small']//div[text()='{assignedOrg}']
