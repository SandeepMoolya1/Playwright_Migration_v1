# Keysight Support (STG) - Product Safety & Service Notes, "All Service Notes" tab.
# Migrated from Selenium ProductSafetyAndServiceNotesPage.java.
# Selenium XPaths (classic UI | data-testid UI) are kept as the primary locator.

meta:
  name: serviceNotes
  description: Product Safety and Service Notes page - All Service Notes tab with search, filters and grid
  url: "?language=en_US"

elements:
  productSafetyOption:
    description: Product Safety & Service Notes entry in the Product Help menu
    xpath: "//a[normalize-space()='Product Safety & Service Notes']"
    index: first

  pageHeader:
    description: Heading of the Product Safety and Service Notes page ("Service Notes")
    xpath: "//h1[text()='Service Notes'] | //h3[@class='section-title']"
    index: first

  allServiceNotesTab:
    description: All Service Notes tab of the Product Safety and Service Notes page
    xpath: "//div[@class='horizontal-tabs']/div[@data-type='AllServiceNotes'] | //button[@data-testid='sn-tab-allServiceNotes']"
    index: first

  productSearchBox:
    description: Search box where a product (model) number is typed to filter the service notes
    xpath: "//div[@class='searchinput']//input[@placeholder='Enter Text to Search...'] | //input[@placeholder='Enter Text to Search...']"
    index: first

  searchIcon:
    description: Search icon button next to the product search box that runs the search
    xpath: "(//div[@class='searchinput']//lightning-icon[@title='Search'])[1] | //button[@title='Search']"
    index: first

  noResultsMessage:
    description: Message shown in the grid area when no service notes match the search ("No Service Notes found")
    xpath: "//*[@class='no-file-msg'] | //div[@role='rowgroup']//span"
    index: first

  filterButton:
    description: Filters button that opens the Service Note Type filter panel
    xpath: "//div[@class='filter-button'] | //button[@data-testid='sn-filters-btn']"
    index: first

  filterApplyButton:
    description: Apply button of the filter panel that applies the selected Service Note Types
    xpath: "//button[@class='primary kcom roundy small']//div[text()='Apply'] | //button[@data-testid='sn-filters-btn-apply']"
    index: first

  filterClearAllButton:
    description: Clear All button of the filter panel that removes every selected Service Note Type
    xpath: "//div[text()='Clear All'] | //button[@data-testid='sn-filters-btn-clear']"
    index: first

  serviceNoteTypeOptions:
    description: One checkbox per Service Note Type in the filter panel (Safety, Priority Safety, Modification Available, ...)
    xpath: "//input[@name='Service Note Type']/following-sibling::label | //div[@role='checkbox']"
    multiple: true

  serviceNoteTypeCheckboxes:
    description: Every Service Note Type checkbox in the filter panel, used to read whether it is selected
    xpath: "//input[@name='Service Note Type'] | //div[@role='checkbox']"
    multiple: true

  serialNumberInput:
    description: Serial Number input in the search area that narrows the service notes to one instrument
    xpath: "//*[@class='slds-show_small']//input | //input[@data-testid='sn-serial-input']"
    index: first

  totalRecordCount:
    description: Label showing the total number of matching service note records
    xpath: "//*[@class='service-count slds-show_medium'] | //span[@data-testid='sn-count']"
    index: first

  tableRows:
    description: Rows of the service notes grid
    xpath: "//table/tbody/tr | //div[@role='rowgroup']/div"
    multiple: true

  serviceNoteTypeCells:
    description: Service Note Type cell of every row in the service notes grid
    xpath: "//tbody[@class='ksp slds-scrollable_x']/tr/td[@data-label='Service Note Type'] | //div[@role='rowgroup']//div[@role='row']/div[@role='cell'][2]"
    multiple: true

  modelNumberCells:
    description: Model Number value (span with a title) of every row in the service notes grid
    xpath: "//div[@aria-label='Model Number']/ancestor::div[@role='row']/following-sibling::div[@role='rowgroup']//div[@role='row']/div//span[@title]"
    multiple: true

  productNumberLinks:
    description: Product number links in the service notes grid that download the service note PDF
    xpath: "//*[@class='link-wrapper']/a | //div[@role='cell']//a"
    multiple: true

