# Keysight Support (STG) — signed-in header and Settings menu.
# Migrated from Selenium HomePage.java.

meta:
  name: home
  description: Signed-in header icons and the Settings dropdown menu
  url: "?language=en_US"

elements:
  searchIcon:
    description: Search (or ask a question) icon button in the header
    xpath: "//button[contains(@aria-label,'Search or ask a question')] | //*[@title='Search or ask a question']"
    index: first

  serviceOrderWizardIcon:
    description: Service Order Wizard (Request Repair or Calibration) icon button in the header
    xpath: "//button[@aria-label='Service Order Wizard'] | //button[@aria-label='Request Repair or Calibration']"
    index: first

  languageOptionsIcon:
    description: Language / Region selector icon button in the header
    xpath: "//button[contains(@aria-label,'Language / Region')] | //button[@aria-label='Select your Location']"
    index: first

  settingsIcon:
    description: Settings (gear) icon button in the header that opens the Settings menu
    xpath: "//button[contains(@aria-label,'Settings')] | //button[@title='Settings']"
    index: first

  notificationsIcon:
    description: Notifications (bell) icon button in the header
    xpath: "//button[contains(@aria-label,'Notifications')] | //button[@title='Notifications']"
    index: first

  myProfileOption:
    description: My Profile entry in the Settings dropdown menu
    xpath: "//a[normalize-space()='My Profile']"
    index: first

  accountSettingsOption:
    description: Account Settings entry in the Settings dropdown menu
    xpath: "//div[@role='menu']//a[text()='Account Settings' and @role='menuitem'] | //*[normalize-space()='Account Settings']"
    index: first

  otherSupportServicesMenu:
    description: Other Support Services button in the header, present once the home page has loaded
    xpath: "//button[text()='Other Support Services']"
    index: first

  customiseDashboardLink:
    description: Customize Dashboard link on the home dashboard that leads to Account Settings
    xpath: "//*[@aria-label='Customize Dashboard']"
    index: first

  hardwareMenu:
    description: Hardware button in the header navigation that opens the Hardware menu
    xpath: "//button[contains(text(),'Hardware')]"
    index: first

  solutionsMenuOption:
    description: Solutions entry in the Hardware menu that opens the Solutions Support page
    xpath: "//a[@class='level2Link' and normalize-space()='Solutions'] | //span[normalize-space()='Solutions']"
    index: first

  adminSettingsOption:
    description: Admin Settings entry in the Settings dropdown menu (CAMS users)
    xpath: "//ul[contains(@class,'popover-content')]//a[normalize-space()='Admin Settings'] | //a[normalize-space()='Admin Settings'] | //button[normalize-space()='Admin Settings'] | //*[normalize-space()='Admin Settings']"
    index: first

  logoutButton:
    description: Log Out button of the signed-in header; ends the session. Several layouts render it, only one is visible
    xpath: "//div[@class='hidden md:block lg:hidden']//*[text()='Log Out'] | //button[normalize-space()='Log Out'] | //header//*[normalize-space(text())='Log Out']"
    filter:
      visible: true
    index: first

