# Keysight Support (STG) - Account Settings > Team Management page.
# Migrated from Selenium AccountSettingsTeamManagementPage.java (only the
# elements used by ASTM_122). Selenium XPaths are kept as primary.

meta:
  name: teamManagement
  description: Team Management page of Account Settings (team membership and create-team entry)
  url: "?language=en_US"

elements:
  leaveTeamButton:
    heal: false   # optional: absence is a valid state, never heal it into another element
    description: Leave Team button, present only when the user belongs to a team
    xpath: "//div[contains(text(),'Leave Team')] | //button[@data-testid='tm-leave-team-btn']"
    index: first

  leaveConfirmButton:
    heal: false   # optional: absence is a valid state, never heal it into another element
    description: Confirm button of the Leave Team confirmation dialog
    xpath: "//button[@title='Confirm']"
    index: first

  removeMemberButtons:
    heal: false   # optional: absence is a valid state, never heal it into another element
    description: Enabled Remove Member buttons, one per removable team member
    xpath: "//button[starts-with(@aria-label,'Remove Member') and not(@disabled)]"
    fallbacks:
      - { xpath: "//button[@data-variant='hyperlink' and not(@disabled)]" }
    multiple: true

  removeMemberConfirmButton:
    heal: false   # optional: absence is a valid state, never heal it into another element
    description: Remove Member confirmation button of the removal dialog
    xpath: "//button[@data-variant='danger']/span[text()='Remove Member']"
    index: first

  toastMessage:
    heal: false   # optional: absence is a valid state, never heal it into another element
    description: Transient toast confirming an action such as leaving a team or removing a member
    xpath: "//div[@class='slds-hyphenate']//span | //div[@role='alert']//p[2]"
    index: first

  createNewTeamButton:
    description: Create New Team button, shown when the user is not part of any team
    xpath: "//button[@title='Create New Team'] | //button[@data-testid='tm-create-team-btn']"
    index: first

  tableRows:
    description: Last row element of the table on the page; its count is the grid row count
    xpath: "//div[@role='row'][last()]"
    multiple: true

  inviteMember:
    description: Invite Member button shown when the user already belongs to a team; opens the Invite Members modal
    xpath: "//button[@data-testid='tm-invite-btn-desktop'] | //button[@title='Invite Members']"
    filter:
      visible: true
    index: first

  typeUsersEmailId:
    description: Email input of the Invite Members modal where the invitee's email is typed
    xpath: "//span[@contenteditable='true' and contains(@class,'text-input')] | //input[@data-testid='tm-invite-email-input']"
    index: first

  emailSuggestions:
    description: Suggestion rows offered under the invite email input; filtered by the typed email
    xpath: "//input[@data-testid='tm-invite-email-input']/following::div"
    multiple: true

  roleDropdown:
    description: Role dropdown ("Select their roles") of the Invite Members modal
    xpath: "//*[@class='ksp base-combobox slds-combobox_container'] | //select | //label[text()='Select their roles']//following::button[@aria-haspopup='listbox']"
    index: first

  roleOptions:
    description: Options (Admin / Member) of the opened role dropdown; filtered by exact role name
    xpath: "//span[@class='slds-truncate'] | //select/option | //button[@role='option']"
    multiple: true

  inviteButton:
    description: Invite (or Confirm) button of the Invite Members modal that sends the invitation
    xpath: "//*[text()='Invite'] | //*[text()='Confirm']"
    index: first

  acceptInviteButton:
    description: Accept Invite button on the Team Management page of an invited user
    xpath: "//button[@title='Accept Invite'] | //button[@data-variant='confirm']"
    index: first

  inviteConfirmButton:
    heal: false   # optional: only some builds ask for confirmation after Accept Invite
    description: Confirm button of the optional confirmation dialog shown after Accept Invite
    xpath: "//c-ksp-button[@class='confirm-btn']/button | //button[@title='Confirm']"
    index: first

