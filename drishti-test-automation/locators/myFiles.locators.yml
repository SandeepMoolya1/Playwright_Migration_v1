# Keysight Support (STG) - My Files page (Account Settings). Migrated from
# Selenium MyFilesComponent.java (only the elements used by SLN_SC_17).
# Selenium XPaths are kept as the primary locator.

meta:
  name: myFiles
  description: My Files page listing exported reports available for download
  url: "?language=en_US"

elements:
  heading:
    description: My Files page heading
    xpath: "//p[text()='My Files'] | //h1[@data-testid='mf-heading']"
    index: first

  firstFileName:
    description: File name of the most recent exported report in the My Files list
    xpath: "(//p[@class='slds-truncate fileName'])[1] | (//*[@data-testid='mf-filename'])[1]"
    index: first

  firstFileExtension:
    description: File extension label of the most recent exported report in the My Files list
    xpath: "(//p[@class='slds-truncate fileName'])[1]/following-sibling::span | (//*[@data-testid='mf-file-card']/div[1]/div/span[2])[1]"
    index: first

  firstDownloadButton:
    description: Download button of the most recent exported report in the My Files list
    xpath: "(//div[@class='btn'])[1]//button | (//div[contains(@class,'btn')])[1]//button | (//*[@data-testid='mf-download-btn'])[1] | (//*[contains(@data-testid,'download')])[1]"
    index: first

