# Keysight Support (STG) - My Support Cases page. Migrated from Selenium
# MySupportCasesPage.java (only the elements used by the SolutionsSupportCase feature).
# Selenium XPaths are kept as the primary locator.

meta:
  name: mySupportCases
  description: My Support Cases page - case search, case list and case details
  url: "?language=en_US"

elements:
  addCommentsOrComments:
    description: Add Comment button or comments area that is present once a case details view has loaded
    xpath: "//button[contains(@class,'add-comment support-case-bn')] | //button[contains(@data-testid,'msc-add-comment-btn')] | //div[@data-testid='msc-comment-view-list']"
    index: first

  searchCaseBox:
    description: Search field of My Support Cases where a case number or keyword is typed
    xpath: "//input[@name='searchText'] | //input[@data-testid='msc-search-input']"
    index: first

  searchButton:
    description: Search icon button next to the My Support Cases search field
    xpath: "(//div[@class='searchinput']//lightning-primitive-icon)[2] | //button[@data-testid='msc-search-btn']"
    index: first

  caseDetailsHeader:
    description: Case Details heading shown once a case has been opened
    xpath: "//div[text()='Case Details'] | //span[text()='Case Details']"
    index: first

  caseSearchResults:
    description: Case items in the My Support Cases search results; filtered by exact case number
    xpath: "//div[@class='leftrw-layout']/* | //*[starts-with(@data-testid,'msc-case-item-')]"
    multiple: true

  caseNumberHeading:
    description: Case Number heading of the opened case details; contains the case number
    xpath: "//h2[starts-with(normalize-space(text()),'Case Number:')] | //*[@data-testid='msc-detail-case-number']"
    index: first

  serialNumber:
    description: Serial Number / Host ID line in the case details
    xpath: "//strong[normalize-space()='Serial Number / Host ID:']/parent::div | //p[span[normalize-space()='Serial Number / Host ID:']]"
    index: first

