meta:
  name: login
  description: Keysight Support header login icon, SSO sign-in form and signed-in markers
  url: "?language=en_US"

elements:
  loginIcon:
    description: Login (person) icon in the site header that starts sign-in; absent once a session exists
    xpath: "//header//*[@clip-path='url(#login_clip)']"
    index: first
    heal: false

  usernameInput:
    description: Username field on the Keysight SSO sign-in form
    css: "input#username"

  passwordInput:
    description: Password field on the Keysight SSO sign-in form
    css: "input#password"

  submitButton:
    description: Submit button that signs in on the SSO form
    xpath: "//button[@type='submit']"
    index: first

  dashboardHeading:
    description: '"My Dashboard" page heading shown after a successful sign-in'
    xpath: "//h1[normalize-space()='My Dashboard']"
    index: first

  sessionIndicator:
    description: Any element only present for an authenticated session - My Dashboard heading, Other Support Services menu button, or Log Out control
    xpath: "//h1[normalize-space()='My Dashboard'] | //button[text()='Other Support Services'] | //*[normalize-space(text())='Log Out']"
    index: first

  logBackInButton:
    description: Log Back In link shown on the signed-out confirmation page; returns to the sign-in form
    xpath: "//a[text()='Log Back In'] | //p[@class='my-4']//button[@class='btn btn-primary']"

